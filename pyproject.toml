[project]
name = "data-analyst-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=2.11.0",
    "ipykernel>=7.4.0",
    "pandas>=3.1.1",
    "python-dotenv>=1.2.4",
]

[project.scripts]
data-analyst-agent = "data_analyst_agent:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
